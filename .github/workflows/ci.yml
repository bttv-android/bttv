name: Build and release preparation
on:
  pull_request:
    branches-ignore:
      - bttv/l10n_master
  workflow_dispatch:
    inputs:
      build_apk:
        description: Build a signed candidate using maintainer-provisioned inputs (no publishing)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Infrastructure, notices, patch syntax and source preservation contracts
        run: python3 tests/stage9_infrastructure.py
      - name: Shell syntax
        run: |
          for script in initworkspace disassemble buildsource build patch tools/docker_build.sh; do
            bash -n "$script"
          done
      - name: Whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            git diff --check "$BASE_SHA...HEAD"
          else
            git diff --check
          fi

  signed_candidate:
    # Untrusted PR code never receives signing secrets. No release/publish job.
    if: github.event_name == 'workflow_dispatch' && inputs.build_apk && github.repository == 'bttv-android/bttv' && github.ref == 'refs/heads/master'
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require explicit maintainer configuration
        env:
          INPUT_URL: ${{ vars.TWITCH_31_INPUT_URL }}
          EXPECTED_SIGNER_SHA256: ${{ vars.RELEASE_SIGNER_SHA256 }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE }}
          KSPASS: ${{ secrets.KSPASS }}
        run: |
          python3 - <<'PY'
          import os, re, urllib.parse
          u = urllib.parse.urlsplit(os.environ['INPUT_URL'])
          assert u.scheme == 'https' and u.hostname and not u.username and not u.password
          assert re.fullmatch('[0-9a-fA-F]{64}', os.environ['EXPECTED_SIGNER_SHA256'])
          assert os.environ['KEYSTORE_BASE64'] and os.environ['KSPASS']
          PY
      - name: Retrieve and validate approved Twitch input
        env:
          INPUT_URL: ${{ vars.TWITCH_31_INPUT_URL }}
        run: |
          curl --fail --location --proto '=https' --proto-redir '=https' --retry 3 "$INPUT_URL" --output twitch.zip
          python3 tools/prepare_twitch_input.py twitch.zip
      - name: Build toolchain
        run: docker build --tag bttv-builder:candidate .
      - name: Create ephemeral signing input
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'bttv-keystore.jks'
          p.write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'], validate=True))
          p.chmod(0o600)
          PY
      - name: Build and verify isolated candidate
        env:
          KSPASS: ${{ secrets.KSPASS }}
          EXPECTED_SIGNER_SHA256: ${{ vars.RELEASE_SIGNER_SHA256 }}
        run: |
          mkdir -p dist/candidate
          docker run --rm \
            --mount type=bind,source="$PWD",target=/source,readonly \
            --mount type=bind,source="$PWD/dist/candidate",target=/output \
            --mount type=bind,source="$RUNNER_TEMP/bttv-keystore.jks",target=/run/bttv-keystore.jks,readonly \
            -e KS=/run/bttv-keystore.jks -e KSPASS -e EXPECTED_SIGNER_SHA256 \
            bttv-builder:candidate
      - uses: actions/upload-artifact@v4
        with:
          name: signed-candidate
          path: |
            dist/candidate/build/twitch.apk
            dist/candidate/build/verification.json
          if-no-files-found: error
          retention-days: 3
      - name: Remove runner signing input
        if: always()
        run: rm -f "$RUNNER_TEMP/bttv-keystore.jks"
