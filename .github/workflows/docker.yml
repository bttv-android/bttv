name: Docker build validation
on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - compose.yaml
      - tools/docker_build.sh
      - .github/workflows/docker.yml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  builder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build toolchain without APKs, signing keys or publishing
        run: docker build --tag bttv-builder:check .
      - name: Check required SDK tools
        run: |
          docker run --rm --entrypoint bash bttv-builder:check -c '
            set -e
            java -version
            python3 --version
            test -x "$ANDROID_SDK_ROOT/build-tools/30.0.3/zipalign"
            test -f "$ANDROID_SDK_ROOT/platforms/android-30/android.jar"
            java -jar "$APKEDITOR_PATH" -version
          '
